[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-oracle-benchmark"
version = "0.1.1"
description = "Oracle-geometry falsification benchmark for tiled first-bounce specular transport"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
cuda = ["cupy-cuda13x[ctk]>=14,<15"]
lpips = ["lpips>=0.1.4"]
dev = ["pytest>=8,<10"]

[project.scripts]
sts2-bench = "sts2.bench:main"
sts2-check = "sts2.check_install:main"

[tool.setuptools]
packages = ["sts2", "raster"]
